name: image

# Builds the server image and pushes it to the GitHub Container Registry, so a
# merge to main yields ghcr.io/<owner>/agora:latest plus an immutable :sha-* tag.
#
# The image is tenant agnostic: the Web UI reads its Logto settings from
# GET /api/config, which the Server derives from its own environment. A Logto
# deployment therefore only sets container environment variables at run time:
#
#   AGORA_LOGTO_ISSUER   e.g. https://logto.example.com/oidc
#   AGORA_LOGTO_APP_ID   the SPA application id
#   AGORA_LOGTO_AUDIENCE the API resource indicator, when one is configured
#
# (AGORA_LOGTO_ENDPOINT overrides the endpoint derived from the issuer.)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Vet for both supported platforms. A symbol that only exists on one of
      # them (syscall.Getsid exists on darwin but not linux, for example) must
      # fail here rather than on a developer's machine or in the image build.
      - name: Go vet
        run: |
          go vet ./...
          GOOS=darwin go vet ./...
          GOOS=linux go vet ./...
      # -p 1 keeps the end-to-end suite from competing with itself for PTYs and
      # loopback ports, which makes it flaky under a parallel package run.
      - name: Go tests
        run: go test -p 1 ./...
      - name: Web build
        run: |
          npm --prefix web ci
          npm --prefix web run build

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to ghcr.io with the workflow's own token.
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase the image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # The linker bakes this into the binary, where `agora version`,
      # GET /api/version and the published version.txt read it from. The
      # metadata action does not expose its own timestamp as an output, so
      # render one here.
      - name: Build timestamp
        id: builddate
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          # The tag (or commit on main) labels the Server and the daemon
          # artifacts it publishes, so `agora update --check` can compare them.
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.builddate.outputs.value }}
          # arm64 matters for workstations and Apple silicon clusters; drop it if
          # build minutes are tight.
          platforms: linux/amd64,linux/arm64
          # Pull requests validate that the image builds without publishing it.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
